name: One-time InsightFlow AI import
on:
  push:
    paths:
      - '.github/workflows/import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract reviewed project
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part0*.txt | base64 --decode > /tmp/insightflow-reviewed.tar.xz
          echo "4035b253d758de476872b471b4ab488d621f9ba35b0bacfa1ce9f8d9c265657f  /tmp/insightflow-reviewed.tar.xz" | sha256sum --check
          tar -tJf /tmp/insightflow-reviewed.tar.xz
          tar -xJf /tmp/insightflow-reviewed.tar.xz -C .
          rm -rf .transfer .github/workflows/import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish InsightFlow AI analytics application"
          git push origin HEAD:main
