[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightflow-ai"
version = "1.0.0"
description = "Explainable CSV analytics with Chainlit, Python EDA and optional Gemini insights"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Abhishek Singh"}]
dependencies = [
  "pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.15", "chainlit>=2.0,<3", "Pillow>=10,<13",
  "google-genai>=1.0,<3", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
